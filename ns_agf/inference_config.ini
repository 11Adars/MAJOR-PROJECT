# NS-AGF Inference Configuration
# Adjust these parameters to improve recognition accuracy

[Buffer Settings]
# How many frames to collect before making prediction (60 frames = 4 seconds at 15 FPS)
buffer_size = 60

# How many recent predictions to use for smoothing (higher = more stable but slower)
prediction_window = 20

[Motion Detection]
# Minimum hand movement required to start prediction (0.01-0.05)
# Lower = more sensitive, Higher = requires more movement
motion_threshold = 0.02

[Confidence Settings]
# Minimum confidence to show prediction (0.5-0.9)
confidence_threshold = 0.70

# Confidence boost for underrepresented classes (0.8-1.0)
# Lower value = easier for rare classes to be detected
underrepresented_boost = 0.85

[Problem-Specific Fixes]
# Classes that are hard to detect (add sign names here)
underrepresented_classes = Manager, Remove, Report, Speak, Illegal

# Class that dominates predictions when idle (usually the most common class in training)
dominant_class = Adress

[MediaPipe Settings]
# Minimum confidence for detection (0.3-0.7)
min_detection_confidence = 0.5

# Minimum confidence for tracking (0.3-0.7)
min_tracking_confidence = 0.5

[Display Settings]
# Show motion indicator on screen
show_motion = true

# Show class ID numbers
show_class_id = true

# Show raw predictions (for debugging)
show_raw_predictions = false

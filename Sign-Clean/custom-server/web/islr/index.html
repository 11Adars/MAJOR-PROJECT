<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Custom Gestures Recognition</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #2c3e50 0%, #3498db 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 1rem;
        }

        .container {
            background: rgba(255, 255, 255, 0.98);
            border-radius: 15px;
            padding: 1.5rem;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1);
            max-width: 900px;
            width: 100%;
            backdrop-filter: blur(10px);
        }

        .header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .header h1 {
            color: #2c3e50;
            font-size: 2rem;
            margin-bottom: 0.5rem;
        }

        .header p {
            color: #7f8c8d;
            font-size: 1rem;
        }

        .main-content {
            display: grid;
            grid-template-columns: 1fr 300px;
            gap: 1.5rem;
            margin-bottom: 1rem;
        }

        .video-section {
            background: white;
            border-radius: 10px;
            padding: 1rem;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.08);
        }

        .video-container {
            position: relative;
            background: #000;
            border-radius: 8px;
            overflow: hidden;
            margin-bottom: 1rem;
            aspect-ratio: 4/3;
        }

        #webcam {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .canvas-overlay {
            position: absolute;
            top: 0;
            left: 0;
            pointer-events: none;
            width: 100%;
            height: 100%;
        }

        .controls {
            display: flex;
            gap: 0.8rem;
            justify-content: center;
        }

        .btn {
            padding: 0.6rem 1.2rem;
            border: none;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-primary {
            background: linear-gradient(45deg, #3498db, #2980b9);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(52, 152, 219, 0.4);
        }

        .btn-secondary {
            background: #95a5a6;
            color: white;
        }

        .btn-secondary:hover {
            background: #7f8c8d;
        }

        .prediction-section {
            background: white;
            border-radius: 10px;
            padding: 1rem;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.08);
        }

        .prediction-display {
            text-align: center;
            padding: 1.5rem;
            background: linear-gradient(135deg, #ecf0f1, #bdc3c7);
            border-radius: 8px;
            margin-bottom: 1rem;
        }

        .prediction-text {
            font-size: 1.8rem;
            font-weight: bold;
            color: #2c3e50;
            margin-bottom: 0.5rem;
        }

        @keyframes pulse {
            0% { transform: scale(1); color: #2c3e50; }
            50% { transform: scale(1.05); color: #e74c3c; }
            100% { transform: scale(1); color: #27ae60; }
        }

        .prediction-confidence {
            font-size: 1rem;
            color: #7f8c8d;
        }

        .prediction-model {
            font-size: 0.8rem;
            color: #95a5a6;
            font-style: italic;
            margin-top: 0.3rem;
        }

        .status-info {
            background: #f8f9fa;
            border-radius: 8px;
            padding: 1rem;
            margin-bottom: 1rem;
        }

        .status-info h4 {
            color: #2c3e50;
            margin-bottom: 0.5rem;
            font-size: 1rem;
        }

        .status-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.5rem;
            font-size: 0.85rem;
        }

        .status-label {
            color: #7f8c8d;
        }

        .status-value {
            color: #2c3e50;
            font-weight: 600;
        }

        .gestures-list {
            max-height: 120px;
            overflow-y: auto;
            background: #f8f9fa;
            border-radius: 8px;
            padding: 0.8rem;
        }

        .gesture-item {
            padding: 0.4rem;
            margin-bottom: 0.2rem;
            background: white;
            border-radius: 4px;
            font-size: 0.85rem;
            color: #2c3e50;
            text-align: center;
        }

        .footer {
            text-align: center;
            color: #7f8c8d;
            font-size: 0.8rem;
            margin-top: 1rem;
        }

        @media (max-width: 768px) {
            .main-content {
                grid-template-columns: 1fr;
            }
            
            .prediction-section {
                order: -1;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="header">
            <h1>Custom Gestures Recognition</h1>
            <p>Real-time custom gesture detection using AI</p>
        </div>

        <div class="main-content">
            <div class="video-section">
                <h3>Live Camera Feed</h3>
                <div class="video-container">
                    <video id="webcam" autoplay muted playsinline></video>
                    <canvas id="canvas" class="canvas-overlay"></canvas>
                </div>
                <div class="controls">
                    <button id="startBtn" class="btn btn-primary">Start Camera</button>
                    <button id="stopBtn" class="btn btn-secondary" disabled>Stop Camera</button>
                </div>
            </div>

            <div class="prediction-section">
                <h3>Detection Results</h3>
                <div class="prediction-display">
                    <div id="prediction" class="prediction-text">Ready to detect</div>
                    <div id="confidence" class="prediction-confidence"></div>
                    <div id="model-used" class="prediction-model"></div>
                </div>
                
                <div class="status-info">
                    <h4>Model Status</h4>
                    <div class="status-item">
                        <span class="status-label">Connection:</span>
                        <span id="connection-status" class="status-value">Checking...</span>
                    </div>
                    <div class="status-item">
                        <span class="status-label">Gestures:</span>
                        <span id="gesture-count" class="status-value">0</span>
                    </div>
                    <div class="status-item">
                        <span class="status-label">Technology:</span>
                        <span id="model-tech" class="status-value">-</span>
                    </div>
                </div>
                
                <h4>Available Gestures:</h4>
                <div id="gestures-list" class="gestures-list">
                    <div class="gesture-item">Loading...</div>
                </div>
            </div>
        </div>

        <div class="footer">
            <p>Custom Gestures Server - AI-Powered Recognition</p>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/control_utils/control_utils.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/holistic/holistic.js"></script>
    <script src="/web/islr/script.js"></script>
</body>
</html>

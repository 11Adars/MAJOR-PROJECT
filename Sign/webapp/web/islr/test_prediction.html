<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Gesture Recognition</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .result { padding: 20px; border: 2px solid #333; margin: 10px 0; font-size: 18px; }
        .sign { background-color: #e7f3ff; }
        .sentence { background-color: #f0f8e7; }
        button { padding: 10px 20px; font-size: 16px; margin: 10px; }
    </style>
</head>
<body>
    <h1>Gesture Recognition Test</h1>
    <button onclick="testPrediction()">Test Prediction API</button>
    <button onclick="clearResults()">Clear Results</button>
    
    <div class="result sign">
        <strong>Current Sign:</strong>
        <div id="sign-result">Click "Test Prediction API" to see results</div>
    </div>
    
    <div class="result sentence">
        <strong>Generated Sentence:</strong>
        <div id="sentence-result">Sentences will appear here</div>
    </div>
    
    <div class="result">
        <strong>Debug Info:</strong>
        <div id="debug-info">Debug information will appear here</div>
    </div>

    <script>
        console.log("🚀 Test page loaded");
        
        async function testPrediction() {
            const debugDiv = document.getElementById('debug-info');
            const signDiv = document.getElementById('sign-result');
            const sentenceDiv = document.getElementById('sentence-result');
            
            debugDiv.innerHTML = "Sending test request...";
            
            try {
                // Send empty data array to test the API
                const response = await fetch('/islr/predict', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify([])
                });
                
                debugDiv.innerHTML += "<br>Response status: " + response.status;
                
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                
                const result = await response.json();
                debugDiv.innerHTML += "<br>Response received: " + JSON.stringify(result);
                
                // Update displays
                if (result.sign) {
                    signDiv.innerHTML = result.sign;
                    signDiv.style.color = result.sign === "no_action" ? "#888" : "#4CAF50";
                } else {
                    signDiv.innerHTML = "No sign field in response";
                }
                
                if (result.sentence) {
                    sentenceDiv.innerHTML = result.sentence;
                } else {
                    sentenceDiv.innerHTML = "No sentence field in response";
                }
                
            } catch (error) {
                debugDiv.innerHTML += "<br>Error: " + error.message;
                console.error('Test prediction error:', error);
            }
        }
        
        function clearResults() {
            document.getElementById('sign-result').innerHTML = "Cleared";
            document.getElementById('sentence-result').innerHTML = "Cleared";
            document.getElementById('debug-info').innerHTML = "Ready for test";
        }
    </script>
</body>
</html>
